name: Build AstrBot armv7 (玩客云)

# 在 GitHub 的免费 x86 服务器上用 QEMU 模拟 armv7 构建，产出可直接 docker load 的镜像包。
# 用法：Actions 页面 → 本工作流 → Run workflow。
#
# 设计要点：
#   1. 不推送任何镜像仓库（fork 出来的仓库默认没有 packages 写权限，推送会直接失败）；
#      构建完用 docker save 打成 tar.gz 作为 artifact 下载，最省事也最不容易卡权限。
#   2. 构建完会在 QEMU 里真正跑一次 import 检查，镜像里缺依赖会在这里暴露，
#      而不是等你在玩客云上启动时才发现。

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.armv7'
      - 'Dockerfile.armv7.dockerignore'
      - 'requirements.armv7.txt'
      - 'faiss_shim/**'
      - '.github/workflows/build-armv7.yml'

permissions:
  contents: read

jobs:
  build:
    name: linux/arm/v7
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 注册 QEMU（arm/v7）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm/v7

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: astrbot-armv7
          driver: docker-container

      - name: 构建镜像（linux/arm/v7）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.armv7
          platforms: linux/arm/v7
          tags: astrbot-armv7:latest
          load: true
          build-args: |
            WITH_NODE=1
            FAISS_SHIM=1
            PIP_INDEX_URL=https://pypi.org/simple
            PIWHEELS_URL=https://www.piwheels.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验架构
        run: |
          set -eux
          docker image inspect astrbot-armv7:latest --format '{{.Os}}/{{.Architecture}}'
          arch="$(docker image inspect astrbot-armv7:latest --format '{{.Architecture}}')"
          test "$arch" = "arm"

      # 注意：这一步标记为 continue-on-error。
      # 原因：runner 宿主机的 Docker 在 exec 一个 armv7 可执行文件时需要内核
      # binfmt_misc 里有 qemu-arm 处理程序。BuildKit 构建时用的是它自带的那套
      # 模拟器，所以镜像能正常构建；但事后用 `docker run` 跑，宿主机不一定已经
      # 注册好 binfmt（典型症状就是 `exec /usr/local/bin/python: exec format error`）。
      # 这不代表镜像有问题——**真正权威的 armv7 导入检查在构建阶段就已经跑过了**
      # （Dockerfile 里的 core deps / faiss smoke 层都是在 QEMU 里真实执行的）。
      # 所以这里失败只记一条警告，不阻断 artifact 产出。
      - name: 运行时自检（可选，失败不阻断）
        continue-on-error: true
        run: |
          set -eux
          docker run --privileged --rm tonistiigi/binfmt --install arm
          docker run --rm --platform linux/arm/v7 --entrypoint python astrbot-armv7:latest -c \
            "import platform; print('machine =', platform.machine())"
          docker run --rm --platform linux/arm/v7 --entrypoint python astrbot-armv7:latest -c \
            "import numpy, quart, aiohttp, pydantic, ormsgpack, watchfiles, lxml, PIL, cryptography, sqlmodel; print('core deps ok')"
          docker run --rm --platform linux/arm/v7 --entrypoint python astrbot-armv7:latest -c \
            "import faiss; print('faiss shim ok:', faiss.__file__)"

      - name: 导出镜像为 tar.gz
        run: |
          set -eux
          docker save astrbot-armv7:latest | gzip -9 > astrbot-armv7.tar.gz
          ls -lh astrbot-armv7.tar.gz
          sha256sum astrbot-armv7.tar.gz | tee astrbot-armv7.tar.gz.sha256

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-armv7-image
          path: |
            astrbot-armv7.tar.gz
            astrbot-armv7.tar.gz.sha256
          compression-level: 0
          retention-days: 7
